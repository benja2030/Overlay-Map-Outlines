# Builds the addon zip and publishes a GitHub release.
#
# Two ways to start it:
#   1. Push a tag:   git tag v1.0.0   then   git push origin v1.0.0
#      (a test version: v0.2.1-beta or v0.2.1-alpha, published as a GitHub pre-release)
#   2. From GitHub:  Actions tab > Release > Run workflow > type the version
#
# What it does:
#   - Converts README.md into README.txt (plain text, readable in Notepad).
#   - Copies the addon files into an OverlayMap_Outlines folder (the name the game needs).
#   - Writes the version into the .toc inside the zip.
#   - Zips the folder and publishes a release with the zip attached. The zip
#     name ends in "-forever" so WowUp knows it is for WoW: Forever.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, for example 1.0.1"
        required: true

permissions:
  contents: write

env:
  ADDON: OverlayMap_Outlines

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Work out the version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="$GITHUB_REF_NAME"
          fi
          VERSION="${VERSION#v}"
          # (a test version may end in -beta or -alpha: 0.2.1-beta)
          if ! echo "$VERSION" | grep -Eq '^[0-9]+(\.[0-9]+)*(-(alpha|beta)[0-9]*)?$'; then
            echo "The version must look like 1.0.1 or 1.0.1-beta, but it is: $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if echo "$VERSION" | grep -q -- '-'; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi

      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Build the addon folder
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          OUT="build/$ADDON"
          mkdir -p "$OUT"

          # Addon files: the .toc, the pictures
          cp "$ADDON.toc" "$OUT/"
          cp -r Outlines "$OUT/"
          # (the caves' lines and their list)
          if [ -d Caves ]; then cp -r Caves "$OUT/"; fi
          if [ -f CaveList.lua ]; then cp CaveList.lua "$OUT/"; fi

          if [ -f LICENSE ]; then cp LICENSE "$OUT/LICENSE.txt"; fi
          if [ -f CHANGELOG.md ]; then cp CHANGELOG.md "$OUT/CHANGELOG.md"; fi

          # README.md -> README.txt
          pandoc README.md --from gfm --to plain --columns=78 --output "$OUT/README.txt"

          # Version from the tag goes into the .toc
          sed -i "s/^## Version:.*/## Version: $VERSION/" "$OUT/$ADDON.toc"

          # (a check: a picture missing would leave that zone without lines)
          COUNT=$(ls "$OUT/Outlines"/*.blp | wc -l)
          echo "Outlines: $COUNT pictures"
          if [ "$COUNT" -lt 40 ]; then
            echo "Too few pictures in Outlines ($COUNT): check the folder was committed in full."
            exit 1
          fi
          # (the .toc loads CaveList.lua: without it, or without the pictures, the caves have no lines)
          if grep -q "CaveList.lua" "$OUT/$ADDON.toc"; then
            CAVES=$(ls "$OUT/Caves"/*.blp 2>/dev/null | wc -l)
            echo "Caves: $CAVES pictures"
            if [ ! -f "$OUT/CaveList.lua" ] || [ "$CAVES" -lt 200 ]; then
              echo "CaveList.lua or the Caves pictures are missing: check they were committed."
              exit 1
            fi
          fi

          cd build
          zip -r -9 "../$ADDON-v$VERSION-forever.zip" "$ADDON"
          cd ..
          ls -la "$ADDON-v$VERSION-forever.zip"

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Overlay Map Outlines v${{ steps.version.outputs.version }}
          files: ${{ env.ADDON }}-v${{ steps.version.outputs.version }}-forever.zip
          generate_release_notes: true
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}